# /etc/nginx/sites-available/foundit  (replace foundit.example.co.zw with your domain)
# Add once inside the http{} block of /etc/nginx/nginx.conf:
#   limit_req_zone $binary_remote_addr zone=foundit:10m rate=10r/s;

server {
    listen 80;
    server_name foundit.example.co.zw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name foundit.example.co.zw;

    # Certificates are added by: sudo certbot --nginx -d foundit.example.co.zw
    client_max_body_size 1m;          # the app never accepts uploads

    location / {
        limit_req zone=foundit burst=30 nodelay;
        proxy_pass http://unix:/run/foundit/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append (stops IP spoofing)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
